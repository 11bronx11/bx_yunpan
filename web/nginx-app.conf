resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

upstream api_backend {
    zone api_backend 64k;
    server api:8081 resolve;
}

upstream minio_backend {
    zone minio_backend 64k;
    server minio:9000 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /readyz {
        access_log off;
        proxy_pass http://api_backend/health/ready;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location = /storage-healthz {
        access_log off;
        proxy_pass http://minio_backend/minio/health/live;
        proxy_set_header Host minio:9000;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location /api/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ^~ /storage/ {
        proxy_pass http://minio_backend/;
        proxy_set_header Host $http_host;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 0;
    }

    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }
}
