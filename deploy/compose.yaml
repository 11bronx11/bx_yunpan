name: bx-yunpan

x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  HTTP_MAX_BODY_BYTES: ${HTTP_MAX_BODY_BYTES:-1048576}
  HTTP_MAX_HEADER_BYTES: ${HTTP_MAX_HEADER_BYTES:-65536}
  HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT:-10s}
  HTTP_PROBE_TIMEOUT: ${HTTP_PROBE_TIMEOUT:-2s}
  HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:-5s}
  HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-60s}
  # Both names are passed during the expand window. New code uses the stable
  # writer endpoint; POSTGRES_DSN remains for older binaries.
  POSTGRES_PRIMARY_DSN: ${POSTGRES_PRIMARY_DSN:-${POSTGRES_DSN:-postgres://${POSTGRES_USER:-yunpan}:${POSTGRES_PASSWORD:-yunpan}@postgres:5432/${POSTGRES_DB:-yunpan}?sslmode=disable}}
  POSTGRES_DSN: ${POSTGRES_DSN:-${POSTGRES_PRIMARY_DSN:-postgres://${POSTGRES_USER:-yunpan}:${POSTGRES_PASSWORD:-yunpan}@postgres:5432/${POSTGRES_DB:-yunpan}?sslmode=disable}}
  POSTGRES_MAX_OPEN_CONNS: ${POSTGRES_MAX_OPEN_CONNS:-32}
  POSTGRES_MAX_IDLE_CONNS: ${POSTGRES_MAX_IDLE_CONNS:-8}
  POSTGRES_CONN_MAX_LIFETIME: ${POSTGRES_CONN_MAX_LIFETIME:-30m}
  POSTGRES_CONN_MAX_IDLE_TIME: ${POSTGRES_CONN_MAX_IDLE_TIME:-5m}
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  REDIS_DB: ${REDIS_DB:-0}
  # Compatibility defaults keep cache and coordination on the bundled
  # Redis. Set role-specific values to separate instances in staging/production.
  REDIS_COORDINATION_ADDR: ${REDIS_COORDINATION_ADDR:-redis:6379}
  REDIS_COORDINATION_PASSWORD: ${REDIS_COORDINATION_PASSWORD:-${REDIS_PASSWORD:-}}
  REDIS_COORDINATION_DB: ${REDIS_COORDINATION_DB:-${REDIS_DB:-0}}
  REDIS_CACHE_ADDR: ${REDIS_CACHE_ADDR:-redis:6379}
  REDIS_CACHE_PASSWORD: ${REDIS_CACHE_PASSWORD:-${REDIS_PASSWORD:-}}
  REDIS_CACHE_DB: ${REDIS_CACHE_DB:-${REDIS_DB:-0}}
  RABBITMQ_URL: ${RABBITMQ_URL:-amqp://${RABBITMQ_USER:-yunpan}:${RABBITMQ_PASSWORD:-yunpan-dev-secret}@rabbitmq:5672/}
  RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-yunpan.tasks}
  RABBITMQ_PREFETCH: ${RABBITMQ_PREFETCH:-16}
  RABBITMQ_PUBLISH_TIMEOUT: ${RABBITMQ_PUBLISH_TIMEOUT:-5s}
  TASK_CANCEL_GRACE: ${TASK_CANCEL_GRACE:-10s}
  CACHE_ENABLED: ${CACHE_ENABLED:-true}
  CACHE_TTL: ${CACHE_TTL:-5m}
  CACHE_L1_MAX_ITEMS: ${CACHE_L1_MAX_ITEMS:-512}
  S3_ENDPOINT: minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-127.0.0.1:3000}
  S3_PUBLIC_PATH_PREFIX: ${S3_PUBLIC_PATH_PREFIX:-/storage}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-yunpan}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-yunpan-dev-secret}
  S3_BUCKET: ${S3_BUCKET:-yunpan}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_SECURE: "false"
  S3_PUBLIC_SECURE: ${S3_PUBLIC_SECURE:-false}
  S3_READ_URL_TTL: ${S3_READ_URL_TTL:-10m}
  AUTH_SIGNING_SEED: ${AUTH_SIGNING_SEED:-bx-yunpan-development-signing-seed}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
  USER_DEFAULT_QUOTA_BYTES: ${USER_DEFAULT_QUOTA_BYTES:-10737418240}
  UPLOAD_SESSION_TTL: ${UPLOAD_SESSION_TTL:-24h}
  UPLOAD_PART_URL_TTL: ${UPLOAD_PART_URL_TTL:-15m}
  UPLOAD_CLEANUP_INTERVAL: ${UPLOAD_CLEANUP_INTERVAL:-5m}
  UPLOAD_CLEANUP_BATCH: ${UPLOAD_CLEANUP_BATCH:-100}
  OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-1s}
  OUTBOX_POLL_MAX_INTERVAL: ${OUTBOX_POLL_MAX_INTERVAL:-30s}
  OUTBOX_SCAN_TIMEOUT: ${OUTBOX_SCAN_TIMEOUT:-10s}
  OUTBOX_NOTIFY_ENABLED: ${OUTBOX_NOTIFY_ENABLED:-true}
  OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-20}
  OUTBOX_TASK_MAX_RETRY: ${OUTBOX_TASK_MAX_RETRY:-8}
  OUTBOX_TASK_TIMEOUT: ${OUTBOX_TASK_TIMEOUT:-30m}
  # New typed event writes stay opt-in until the compatibility relay is deployed.
  OUTBOX_V2_EVENTS_ENABLED: ${OUTBOX_V2_EVENTS_ENABLED:-false}
  OBJECT_GC_DELAY: ${OBJECT_GC_DELAY:-24h}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-8}
  WORKER_METRICS_ADDR: ${WORKER_METRICS_ADDR:-:8083}
  WORKER_QUEUE_AI: ${WORKER_QUEUE_AI:-4}
  WORKER_QUEUE_MEDIA: ${WORKER_QUEUE_MEDIA:-4}
  WORKER_QUEUE_OBJECT: ${WORKER_QUEUE_OBJECT:-2}
  WORKER_QUEUE_MAINTENANCE: ${WORKER_QUEUE_MAINTENANCE:-1}
  WORKER_QUEUE_UPLOAD: ${WORKER_QUEUE_UPLOAD:-2}
  AUTH_ISSUER: ${AUTH_ISSUER:-bx-yunpan}
  SHARE_SECRET: ${SHARE_SECRET:-bx-yunpan-development-share-secret}
  AUTH_ACCESS_TTL: ${AUTH_ACCESS_TTL:-15m}
  AUTH_REFRESH_TTL: ${AUTH_REFRESH_TTL:-720h}
  AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
  SHARE_ACCESS_TTL: ${SHARE_ACCESS_TTL:-15m}
  AI_ENABLED: ${AI_ENABLED:-true}
  AI_PROVIDER: ${AI_PROVIDER:-fake}
  DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
  AI_BASE_URL: ${AI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
  AI_CHAT_MODEL: ${AI_CHAT_MODEL:-qwen-plus}
  AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-v4}
  AI_VISION_MODEL: ${AI_VISION_MODEL:-qwen-vl-plus}
  AI_RERANK_ENABLED: ${AI_RERANK_ENABLED:-false}
  AI_RERANK_BASE_URL: ${AI_RERANK_BASE_URL:-}
  AI_RERANK_MODEL: ${AI_RERANK_MODEL:-qwen3-rerank}
  AI_RERANK_CANDIDATES: ${AI_RERANK_CANDIDATES:-30}
  AI_RERANK_TOP_K: ${AI_RERANK_TOP_K:-8}
  AI_RERANK_TIMEOUT: ${AI_RERANK_TIMEOUT:-30s}
  # migrations use vector(1024); deploy/up.sh rejects a mismatched value early
  AI_EMBEDDING_DIMENSION: ${AI_EMBEDDING_DIMENSION:-1024}
  AI_MAX_OBJECT_MIB: ${AI_MAX_OBJECT_MIB:-32}
  AI_REQUEST_TIMEOUT: ${AI_REQUEST_TIMEOUT:-90s}
  AI_RATE_LIMIT_ENABLED: ${AI_RATE_LIMIT_ENABLED:-true}
  AI_RATE_LIMIT_SEARCH_PER_MINUTE: ${AI_RATE_LIMIT_SEARCH_PER_MINUTE:-30}
  AI_RATE_LIMIT_ASK_PER_MINUTE: ${AI_RATE_LIMIT_ASK_PER_MINUTE:-10}
  AI_RATE_LIMIT_REPROCESS_PER_MINUTE: ${AI_RATE_LIMIT_REPROCESS_PER_MINUTE:-3}
  AISVC_GRPC_ADDR: ${AISVC_GRPC_ADDR:-:8082}
  AISVC_GRPC_TARGET: ${AISVC_GRPC_TARGET:-aisvc:8082}
  AI_SERVICE_ROLE: ${AI_SERVICE_ROLE:-combined}
  AISVC_CALL_TIMEOUT: ${AISVC_CALL_TIMEOUT:-120s}
  AISVC_SEARCH_MAX_ATTEMPTS: ${AISVC_SEARCH_MAX_ATTEMPTS:-3}
  AISVC_REPROCESS_MAX_ATTEMPTS: ${AISVC_REPROCESS_MAX_ATTEMPTS:-3}
  AISVC_RETRY_BASE_BACKOFF: ${AISVC_RETRY_BASE_BACKOFF:-20ms}
  AISVC_RETRY_MAX_BACKOFF: ${AISVC_RETRY_MAX_BACKOFF:-1s}
  AISVC_BREAKER_WINDOW: ${AISVC_BREAKER_WINDOW:-10s}
  AISVC_BREAKER_MIN_REQUESTS: ${AISVC_BREAKER_MIN_REQUESTS:-20}
  AISVC_BREAKER_FAILURE_RATE: ${AISVC_BREAKER_FAILURE_RATE:-0.5}
  AISVC_BREAKER_OPEN_TIMEOUT: ${AISVC_BREAKER_OPEN_TIMEOUT:-5s}
  AISVC_BREAKER_HALF_OPEN_PROBES: ${AISVC_BREAKER_HALF_OPEN_PROBES:-3}
  PARSER_REMOTE_ENABLED: ${PARSER_REMOTE_ENABLED:-true}
  PARSER_GRPC_ADDR: ${PARSER_GRPC_ADDR:-:8084}
  PARSER_GRPC_TARGET: ${PARSER_GRPC_TARGET:-parser-svc:8084}
  PARSER_ETCD_SERVICE_PREFIX: ${PARSER_ETCD_SERVICE_PREFIX:-/services/document-parser}
  PARSER_ADVERTISE_ADDR: ${PARSER_ADVERTISE_ADDR:-}
  PARSER_CALL_TIMEOUT: ${PARSER_CALL_TIMEOUT:-90s}
  PARSER_MAX_CONCURRENT: ${PARSER_MAX_CONCURRENT:-2}
  PARSER_ENGINE_ADDR: ${PARSER_ENGINE_ADDR:-127.0.0.1:8090}
  PARSER_WORKER_DIR: ${PARSER_WORKER_DIR:-/app/parser_worker}
  PARSER_PROFILE_VERSION: ${PARSER_PROFILE_VERSION:-light-parser-v1}
  PARSER_CHUNK_TOKEN_BUDGET: ${PARSER_CHUNK_TOKEN_BUDGET:-600}
  PARSER_CHUNK_OVERLAP_TOKENS: ${PARSER_CHUNK_OVERLAP_TOKENS:-60}
  PARSER_MAX_CHUNKS: ${PARSER_MAX_CHUNKS:-256}
  PARSER_CHUNKER_VERSION: ${PARSER_CHUNKER_VERSION:-document-chunker-v3}
  PARSER_TOKENIZER_ID: ${PARSER_TOKENIZER_ID:-mixed-script-estimate-v1}
  # 链路追踪：默认关闭，开启前先起 observability profile（含 otel-collector 与 jaeger）。
  OTEL_TRACES_ENABLED: ${OTEL_TRACES_ENABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-otel-collector:4317}
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
  # 服务注册发现：关闭时 API 直连 AISVC_GRPC_TARGET，多副本无法自动发现。
  ETCD_ENABLED: ${ETCD_ENABLED:-true}
  ETCD_ENDPOINTS: ${ETCD_ENDPOINTS:-etcd:2379}
  ETCD_USERNAME: ${ETCD_USERNAME:-}
  ETCD_PASSWORD: ${ETCD_PASSWORD:-}
  ETCD_DIAL_TIMEOUT: ${ETCD_DIAL_TIMEOUT:-5s}
  ETCD_SERVICE_PREFIX: ${ETCD_SERVICE_PREFIX:-/services/aisvc}
  ETCD_LEASE_TTL: ${ETCD_LEASE_TTL:-10s}
  # 留空则用容器 hostname + 监听端口，--scale 时每个副本自动注册自己的地址。
  AISVC_ADVERTISE_ADDR: ${AISVC_ADVERTISE_ADDR:-}
  # Outbox dispatcher 多副本选主，避免同一批 outbox 行被重复投递。
  OUTBOX_LEADER_LOCK_ENABLED: ${OUTBOX_LEADER_LOCK_ENABLED:-true}
  OUTBOX_LEADER_LOCK_KEY: ${OUTBOX_LEADER_LOCK_KEY:-yunpan:outbox:dispatcher:leader}
  OUTBOX_LEADER_LOCK_TTL: ${OUTBOX_LEADER_LOCK_TTL:-15s}
  SEARCH_INDEX_ENABLED: ${SEARCH_INDEX_ENABLED:-false}
  SEARCH_WRITE_BACKENDS: ${SEARCH_WRITE_BACKENDS:-postgres}
  SEARCH_READ_BACKEND: ${SEARCH_READ_BACKEND:-postgres}
  SEARCH_SHADOW_SAMPLE_RATE: ${SEARCH_SHADOW_SAMPLE_RATE:-0}
  SEARCH_INDEX_EPOCH: ${SEARCH_INDEX_EPOCH:-v1}
  SEARCH_ES_ENDPOINT: ${SEARCH_ES_ENDPOINT:-}
  SEARCH_ES_USERNAME: ${SEARCH_ES_USERNAME:-}
  SEARCH_ES_PASSWORD: ${SEARCH_ES_PASSWORD:-}
  SEARCH_QDRANT_ENDPOINT: ${SEARCH_QDRANT_ENDPOINT:-}
  SEARCH_QDRANT_API_KEY: ${SEARCH_QDRANT_API_KEY:-}
  SEARCH_EXTERNAL_TIMEOUT: ${SEARCH_EXTERNAL_TIMEOUT:-2s}
  SEARCH_EXTERNAL_WRITE_TIMEOUT: ${SEARCH_EXTERNAL_WRITE_TIMEOUT:-10s}
  SEARCH_INDEX_BATCH_SIZE: ${SEARCH_INDEX_BATCH_SIZE:-100}
  SEARCH_VECTOR_OVERSAMPLE: ${SEARCH_VECTOR_OVERSAMPLE:-4}
  SEARCH_EXTERNAL_FALLBACK: ${SEARCH_EXTERNAL_FALLBACK:-true}

x-parser-environment: &parser-environment
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  AI_ENABLED: "false"
  AUTH_SIGNING_SEED: parser-unused-config-only
  SHARE_SECRET: parser-unused-config-only
  WORKER_METRICS_ADDR: ${WORKER_METRICS_ADDR:-:8083}
  PARSER_REMOTE_ENABLED: ${PARSER_REMOTE_ENABLED:-true}
  PARSER_GRPC_ADDR: ${PARSER_GRPC_ADDR:-:8084}
  PARSER_ETCD_SERVICE_PREFIX: ${PARSER_ETCD_SERVICE_PREFIX:-/services/document-parser}
  PARSER_ADVERTISE_ADDR: ${PARSER_ADVERTISE_ADDR:-}
  PARSER_CALL_TIMEOUT: ${PARSER_CALL_TIMEOUT:-90s}
  PARSER_MAX_CONCURRENT: ${PARSER_MAX_CONCURRENT:-2}
  PARSER_ENGINE_ADDR: ${PARSER_ENGINE_ADDR:-127.0.0.1:8090}
  PARSER_WORKER_DIR: ${PARSER_WORKER_DIR:-/app/parser_worker}
  PARSER_PROFILE_VERSION: ${PARSER_PROFILE_VERSION:-light-parser-v1}
  PARSER_CHUNK_TOKEN_BUDGET: ${PARSER_CHUNK_TOKEN_BUDGET:-600}
  PARSER_CHUNK_OVERLAP_TOKENS: ${PARSER_CHUNK_OVERLAP_TOKENS:-60}
  PARSER_MAX_CHUNKS: ${PARSER_MAX_CHUNKS:-256}
  PARSER_CHUNKER_VERSION: ${PARSER_CHUNKER_VERSION:-document-chunker-v3}
  PARSER_TOKENIZER_ID: ${PARSER_TOKENIZER_ID:-mixed-script-estimate-v1}
  OTEL_TRACES_ENABLED: ${OTEL_TRACES_ENABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-otel-collector:4317}
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
  ETCD_ENABLED: ${ETCD_ENABLED:-true}
  ETCD_ENDPOINTS: ${ETCD_ENDPOINTS:-etcd:2379}
  ETCD_USERNAME: ${ETCD_USERNAME:-}
  ETCD_PASSWORD: ${ETCD_PASSWORD:-}
  ETCD_DIAL_TIMEOUT: ${ETCD_DIAL_TIMEOUT:-5s}
  ETCD_LEASE_TTL: ${ETCD_LEASE_TTL:-10s}

services:
  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:4.1-management-alpine}
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-yunpan}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-yunpan-dev-secret}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 2:2"
    ports:
      - "${INFRA_BIND_IP:-127.0.0.1}:${RABBITMQ_PORT:-5672}:5672"
      - "${INFRA_BIND_IP:-127.0.0.1}:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 60s

  postgres:
    image: ${DOCKER_REGISTRY:-docker.io}/pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yunpan}
      POSTGRES_USER: ${POSTGRES_USER:-yunpan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yunpan}
    ports:
      - "${INFRA_BIND_IP:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  redis:
    image: ${DOCKER_REGISTRY:-docker.io}/library/redis:8.10-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - /bin/sh
      - -ec
      - |
        if [ -n "$${REDIS_PASSWORD}" ]; then
          exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
        fi
        exec redis-server --appendonly yes
    ports:
      - "${INFRA_BIND_IP:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  # Optional P4 role isolation. The compatibility redis service remains the
  # default; deploy/up.sh --redis-split points application clients here.
  redis-coordination:
    profiles: ["redis-split"]
    image: ${DOCKER_REGISTRY:-docker.io}/library/redis:8.10-alpine
    environment:
      ROLE_REDIS_PASSWORD: ${REDIS_COORDINATION_PASSWORD:-${REDIS_PASSWORD:-}}
    command:
      - /bin/sh
      - -ec
      - |
        if [ -n "$${ROLE_REDIS_PASSWORD}" ]; then
          exec redis-server --save "" --appendonly no --requirepass "$${ROLE_REDIS_PASSWORD}"
        fi
        exec redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$ROLE_REDIS_PASSWORD\" ]; then redis-cli --no-auth-warning -a \"$$ROLE_REDIS_PASSWORD\" ping; else redis-cli ping; fi"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  redis-cache:
    profiles: ["redis-split"]
    image: ${DOCKER_REGISTRY:-docker.io}/library/redis:8.10-alpine
    environment:
      ROLE_REDIS_PASSWORD: ${REDIS_CACHE_PASSWORD:-${REDIS_PASSWORD:-}}
    command:
      - /bin/sh
      - -ec
      - |
        if [ -n "$${ROLE_REDIS_PASSWORD}" ]; then
          exec redis-server --save "" --appendonly no --requirepass "$${ROLE_REDIS_PASSWORD}"
        fi
        exec redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$ROLE_REDIS_PASSWORD\" ]; then redis-cli --no-auth-warning -a \"$$ROLE_REDIS_PASSWORD\" ping; else redis-cli ping; fi"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  # 上游官方镜像只发布在 quay.io，不走 DOCKER_REGISTRY 前缀。
  etcd:
    profiles: ["ai", "ai-split", "parser"]
    image: ${ETCD_IMAGE:-quay.io/coreos/etcd:v3.6.6}
    command: ["/usr/local/bin/etcd"]
    environment:
      # 只在 compose 内网监听，不映射到宿主机，因此开发环境不启用认证。
      ETCD_NAME: yunpan-etcd
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
      ETCD_INITIAL_CLUSTER: yunpan-etcd=http://etcd:2380
      ETCD_INITIAL_CLUSTER_STATE: new
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "endpoint", "health"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  minio:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-yunpan}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-yunpan-dev-secret}
    ports:
      - "${INFRA_BIND_IP:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
      - "${INFRA_BIND_IP:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'mc alias set health http://127.0.0.1:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null 2>&1 && mc ready --quiet health']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  minio-init:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-yunpan}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-yunpan-dev-secret}
      S3_BUCKET: ${S3_BUCKET:-yunpan}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${S3_BUCKET}" &&
        mc anonymous set none "local/$${S3_BUCKET}"
    restart: "no"

  migrate:
    profiles: ["app"]
    image: bx-yunpan-migrate:${APP_IMAGE_TAG:-local}
    build:
      context: ../backend
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-docker.io}
        GO_VERSION: ${GO_VERSION:-1.25.13}
        GO_PROXY: ${GO_PROXY:-https://proxy.golang.org,direct}
        GO_BUILD_PARALLELISM: ${GO_BUILD_PARALLELISM:-1}
        GO_BUILD_MAX_PROCS: ${GO_BUILD_MAX_PROCS:-2}
        TARGET: migrate
    command: ["up"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Offline one-time import; legacy workers must stay stopped.
  migrate-asynq:
    profiles: ["migration"]
    image: bx-yunpan-migrate-asynq:${APP_IMAGE_TAG:-local}
    build:
      context: ../backend
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-docker.io}
        GO_VERSION: ${GO_VERSION:-1.25.13}
        GO_PROXY: ${GO_PROXY:-https://proxy.golang.org,direct}
        TARGET: migrate-asynq
    environment:
      <<: *app-environment
      LEGACY_REDIS_ADDR: ${LEGACY_REDIS_ADDR:-}
      LEGACY_REDIS_PASSWORD: ${LEGACY_REDIS_PASSWORD:-}
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: "no"

  api:
    profiles: ["app"]
    image: bx-yunpan-api:${APP_IMAGE_TAG:-local}
    build:
      context: ../backend
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-docker.io}
        GO_VERSION: ${GO_VERSION:-1.25.13}
        GO_PROXY: ${GO_PROXY:-https://proxy.golang.org,direct}
        GO_BUILD_PARALLELISM: ${GO_BUILD_PARALLELISM:-1}
        GO_BUILD_MAX_PROCS: ${GO_BUILD_MAX_PROCS:-2}
        TARGET: api
    environment:
      <<: *app-environment
      HTTP_ADDR: :8081
    # API is reachable through the Web/Gateway service. Do not bind a fixed
    # host port here: Compose must be able to scale API replicas.
    expose:
      - "8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      # API 本身不依赖 aisvc 才能提供目录、上传与下载；AI 未就绪时相关接口返回 503。
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8081/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    init: true
    stop_grace_period: 15s

  worker:
    profiles: ["app"]
    image: bx-yunpan-worker:${APP_IMAGE_TAG:-local}
    build:
      context: ../backend
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-docker.io}
        GO_VERSION: ${GO_VERSION:-1.25.13}
        GO_PROXY: ${GO_PROXY:-https://proxy.golang.org,direct}
        GO_BUILD_PARALLELISM: ${GO_BUILD_PARALLELISM:-1}
        GO_BUILD_MAX_PROCS: ${GO_BUILD_MAX_PROCS:-2}
        TARGET: worker
    environment: *app-environment
    expose:
      - "8083"
    depends_on:
      rabbitmq: {condition: service_healthy}
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: true
    stop_grace_period: 30s

  # P2 distributed roles. They are opt-in so the legacy combined worker stays
  # the default local profile and remains the rollback path.
  outbox-relay:
    profiles: ["distributed"]
    image: bx-yunpan-outbox-relay:${APP_IMAGE_TAG:-local}
    build:
      context: ../backend
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-docker.io}
        GO_VERSION: ${GO_VERSION:-1.25.13}
        GO_PROXY: ${GO_PROXY:-https://proxy.golang.org,direct}
        GO_BUILD_PARALLELISM: ${GO_BUILD_PARALLELISM:-1}
        GO_BUILD_MAX_PROCS: ${GO_BUILD_MAX_PROCS:-2}
        TARGET: outbox-relay
    environment: *app-environment
    expose: ["8083"]
    depends_on:
      rabbitmq: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      minio-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped
    init: true
    stop_grace_period: 15s

  object-worker:
    profiles: ["distributed"]
    image: bx-yunpan-object-worker:${APP_IMAGE_TAG:-local}
    build:
      context: ../backend
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-docker.io}
        GO_VERSION: ${GO_VERSION:-1.25.13}
        GO_PROXY: ${GO_PROXY:-https://proxy.golang.org,direct}
        GO_BUILD_PARALLELISM: ${GO_BUILD_PARALLELISM:-1}
        GO_BUILD_MAX_PROCS: ${GO_BUILD_MAX_PROCS:-2}
        TARGET: object-worker
    environment: *app-environment
    expose: ["8083"]
    depends_on:
      rabbitmq: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      minio-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s

  media-worker:
    profiles: ["distributed"]
    image: bx-yunpan-media-worker:${APP_IMAGE_TAG:-local}
    build:
      context: ../backend
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-docker.io}
        GO_VERSION: ${GO_VERSION:-1.25.13}
        GO_PROXY: ${GO_PROXY:-https://proxy.golang.org,direct}
        GO_BUILD_PARALLELISM: ${GO_BUILD_PARALLELISM:-1}
        GO_BUILD_MAX_PROCS: ${GO_BUILD_MAX_PROCS:-2}
        TARGET: media-worker
    environment: *app-environment
    expose: ["8083"]
    depends_on:
      rabbitmq: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      minio-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s

  maintenance-worker:
    profiles: ["distributed"]
    image: bx-yunpan-maintenance-worker:${APP_IMAGE_TAG:-local}
    build:
      context: ../backend
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-docker.io}
        GO_VERSION: ${GO_VERSION:-1.25.13}
        GO_PROXY: ${GO_PROXY:-https://proxy.golang.org,direct}
        GO_BUILD_PARALLELISM: ${GO_BUILD_PARALLELISM:-1}
        GO_BUILD_MAX_PROCS: ${GO_BUILD_MAX_PROCS:-2}
        TARGET: maintenance-worker
    environment: *app-environment
    expose: ["8083"]
    depends_on:
      rabbitmq: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      minio-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s

  upload-worker:
    profiles: ["distributed"]
    image: bx-yunpan-upload-worker:${APP_IMAGE_TAG:-local}
    build:
      context: ../backend
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-docker.io}
        GO_VERSION: ${GO_VERSION:-1.25.13}
        GO_PROXY: ${GO_PROXY:-https://proxy.golang.org,direct}
        GO_BUILD_PARALLELISM: ${GO_BUILD_PARALLELISM:-1}
        GO_BUILD_MAX_PROCS: ${GO_BUILD_MAX_PROCS:-2}
        TARGET: upload-worker
    environment: *app-environment
    expose: ["8083"]
    depends_on:
      rabbitmq: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      minio-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s

  # Opt-in single-node derived search backends. They are for rebuild, shadow,
  # and failure-recovery rehearsal; PostgreSQL remains the authority.
  elasticsearch:
    profiles: ["search-external"]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${SEARCH_ES_JAVA_OPTS:--Xms512m -Xmx512m}
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    expose: ["9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  qdrant:
    profiles: ["search-external"]
    image: qdrant/qdrant:v1.15.5
    volumes:
      - qdrant-data:/qdrant/storage
    expose: ["6333"]
    healthcheck:
      # The official image is intentionally minimal and does not ship wget or
      # curl. Use bash's TCP client so the readiness probe works with the
      # image we actually deploy.
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  search-indexer:
    profiles: ["search"]
    image: bx-yunpan-search-indexer:${APP_IMAGE_TAG:-local}
    build:
      context: ../backend
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-docker.io}
        GO_VERSION: ${GO_VERSION:-1.25.13}
        GO_PROXY: ${GO_PROXY:-https://proxy.golang.org,direct}
        GO_BUILD_PARALLELISM: ${GO_BUILD_PARALLELISM:-1}
        GO_BUILD_MAX_PROCS: ${GO_BUILD_MAX_PROCS:-2}
        TARGET: search-indexer
    environment: *app-environment
    expose: ["8083"]
    depends_on:
      rabbitmq: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      minio-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s

  # 独立文档解析服务：由 --profile parser 显式启用，可单独扩缩。
  parser-svc:
    profiles: ["parser"]
    image: bx-yunpan-parser-svc:${APP_IMAGE_TAG:-local}
    build:
      context: ../backend
      dockerfile: Dockerfile.parser
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-docker.io}
        GO_VERSION: ${GO_VERSION:-1.25.13}
        UBUNTU_VERSION: ${UBUNTU_VERSION:-24.04}
        UBUNTU_MIRROR: ${UBUNTU_MIRROR:-http://mirrors.aliyun.com/ubuntu-ports/}
        GO_PROXY: ${PARSER_GO_PROXY:-https://goproxy.cn,direct}
        PYTHON_PACKAGE_INDEX: ${PARSER_PYTHON_INDEX:-https://mirrors.aliyun.com/pypi/simple}
        GO_BUILD_PARALLELISM: ${GO_BUILD_PARALLELISM:-1}
        GO_BUILD_MAX_PROCS: ${GO_BUILD_MAX_PROCS:-2}
        TARGET: parser-svc
    environment: *parser-environment
    expose: ["8083", "8084"]
    depends_on:
      etcd: {condition: service_healthy}
    cpus: ${PARSER_CPUS:-2}
    mem_limit: ${PARSER_MEMORY_LIMIT:-1g}
    healthcheck:
      test: ["CMD", "/app/service", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    init: true
    stop_grace_period: 100s

  # AI 服务：gRPC server + 独占 ai 队列的 RabbitMQ worker。
  # 抽取、OCR、Embedding 是 CPU/IO 重活，独立进程才能独立扩容：
  # docker compose up -d --scale aisvc=2
  aisvc:
    profiles: ["ai"]
    image: bx-yunpan-aisvc:${APP_IMAGE_TAG:-local}
    build:
      context: ../backend
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-docker.io}
        GO_VERSION: ${GO_VERSION:-1.25.13}
        GO_PROXY: ${GO_PROXY:-https://proxy.golang.org,direct}
        GO_BUILD_PARALLELISM: ${GO_BUILD_PARALLELISM:-1}
        GO_BUILD_MAX_PROCS: ${GO_BUILD_MAX_PROCS:-2}
        TARGET: aisvc
    environment: *app-environment
    depends_on:
      rabbitmq: {condition: service_healthy}
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      etcd:
        condition: service_healthy
    healthcheck:
      # 镜像里没有 grpc_health_probe，用自己的二进制走 grpc.health.v1 探活。
      test: ["CMD", "/app/service", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    init: true
    stop_grace_period: 30s

  # P3 split profile. Both services reuse the compatible aisvc image but have
  # disjoint process roles: query advertises gRPC, indexer owns only queue ai.
  # Keep the legacy aisvc service as the default rollback path.
  ai-query:
    profiles: ["ai-split"]
    image: bx-yunpan-aisvc:${APP_IMAGE_TAG:-local}
    environment:
      <<: *app-environment
      AI_SERVICE_ROLE: query
      AISVC_GRPC_ADDR: :8082
    expose: ["8083", "8082"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      minio-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      etcd: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/app/service", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    init: true
    stop_grace_period: 30s

  ai-indexer:
    profiles: ["ai-split"]
    image: bx-yunpan-aisvc:${APP_IMAGE_TAG:-local}
    environment:
      <<: *app-environment
      AI_SERVICE_ROLE: indexer
    expose: ["8083"]
    depends_on:
      rabbitmq: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      minio-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s

  web:
    profiles: ["app"]
    image: bx-yunpan-web:${APP_IMAGE_TAG:-local}
    build:
      context: ../web
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-docker.io}
        NODE_VERSION: ${NODE_VERSION:-22.23.0}
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz && wget -q -O /dev/null http://127.0.0.1/readyz && wget -q -O /dev/null http://127.0.0.1/storage-healthz"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  otel-collector:
    profiles: ["observability"]
    image: ${DOCKER_REGISTRY:-docker.io}/otel/opentelemetry-collector:0.158.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    depends_on:
      - jaeger
    restart: unless-stopped

  jaeger:
    profiles: ["observability"]
    image: ${DOCKER_REGISTRY:-docker.io}/jaegertracing/all-in-one:1.74.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"
    restart: unless-stopped

  prometheus:
    profiles: ["observability"]
    image: ${DOCKER_REGISTRY:-docker.io}/prom/prometheus:v3.13.2
    command: ["--config.file=/etc/prometheus/prometheus.yaml", "--storage.tsdb.retention.time=3d"]
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./prometheus/high-concurrency.rules.yaml:/etc/prometheus/high-concurrency.rules.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    profiles: ["observability"]
    image: ${DOCKER_REGISTRY:-docker.io}/grafana/grafana:13.1.3
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  rabbitmq-data:
  postgres-data:
  redis-data:
  minio-data:
  etcd-data:
  elasticsearch-data:
  qdrant-data:
  prometheus-data:
  grafana-data:
