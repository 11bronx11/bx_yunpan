services:
  ai-postgres:
    profiles: ["ai-split"]
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${AI_POSTGRES_USER:-yunpan_ai}
      POSTGRES_PASSWORD: ${AI_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AI_POSTGRES_DB:-yunpan_ai}
    ports: ["${INFRA_BIND_IP:-127.0.0.1}:${AI_POSTGRES_PORT:-5434}:5432"]
    volumes: ["ai-postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate-ai:
    profiles: ["ai-split"]
    image: bx-yunpan-migrate:${APP_IMAGE_TAG:-local}
    environment:
      <<: *app-environment
      AI_MIGRATION_DSN: ${AI_MIGRATION_DSN:-postgres://${AI_POSTGRES_USER:-yunpan_ai}:${AI_POSTGRES_PASSWORD}@ai-postgres:5432/${AI_POSTGRES_DB:-yunpan_ai}?sslmode=disable}
    command: ["ai", "up"]
    depends_on:
      ai-postgres: {condition: service_healthy}
    restart: "no"

  ai-migrate:
    profiles: ["ai-split", "migration"]
    image: bx-yunpan-ai-migrate:${APP_IMAGE_TAG:-local}
    build:
      context: ../backend
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-docker.io}
        GO_VERSION: ${GO_VERSION:-1.25.13}
        GO_PROXY: ${GO_PROXY:-https://proxy.golang.org,direct}
        GO_BUILD_PARALLELISM: ${GO_BUILD_PARALLELISM:-1}
        GO_BUILD_MAX_PROCS: ${GO_BUILD_MAX_PROCS:-2}
        TARGET: ai-migrate
    environment:
      <<: *app-environment
      AI_MIGRATION_DSN: ${AI_MIGRATION_DSN:-postgres://${AI_POSTGRES_USER:-yunpan_ai}:${AI_POSTGRES_PASSWORD}@ai-postgres:5432/${AI_POSTGRES_DB:-yunpan_ai}?sslmode=disable}
      AI_LEGACY_WRITERS_STOPPED: "${AI_LEGACY_WRITERS_STOPPED:-false}"
      AI_CONTROL_MIGRATION_DSN: ${AI_CONTROL_MIGRATION_DSN:-${ASYNC_CONTROL_DSN:-postgres://${ASYNC_POSTGRES_USER:-yunpan_control}:${ASYNC_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD:-yunpan}}@async-postgres:5432/${ASYNC_POSTGRES_DB:-yunpan_control}?sslmode=disable}}
