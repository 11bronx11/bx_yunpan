  async-postgres:
    profiles: ["app"]
    image: ${DOCKER_REGISTRY:-docker.io}/library/postgres:17-alpine
    environment:
      POSTGRES_USER: ${ASYNC_POSTGRES_USER:-yunpan_control}
      POSTGRES_PASSWORD: ${ASYNC_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD:-yunpan}}
      POSTGRES_DB: ${ASYNC_POSTGRES_DB:-yunpan_control}
    ports: ["${INFRA_BIND_IP:-127.0.0.1}:${ASYNC_POSTGRES_PORT:-5433}:5432"]
    volumes: ["async-postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate-control:
    profiles: ["app"]
    image: bx-yunpan-migrate:${APP_IMAGE_TAG:-local}
    command: ["control", "up"]
    environment: *app-environment
    depends_on:
      async-postgres: {condition: service_healthy}
    restart: "no"

  async-reader-init:
    profiles: ["app"]
    image: ${DOCKER_REGISTRY:-docker.io}/library/postgres:17-alpine
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-yunpan}
      PGPASSWORD: ${POSTGRES_PASSWORD:-yunpan}
      PGDATABASE: ${POSTGRES_DB:-yunpan}
      READER: ${POSTGRES_READER_USER:-yunpan_async_reader}
      READER_PASSWORD: ${POSTGRES_READER_PASSWORD:-${POSTGRES_PASSWORD:-yunpan}}
    volumes: ["./async-reader-init.sql:/reader.sql:ro"]
    entrypoint: ["/bin/sh", "-ec"]
    command: ['exec psql -X -q -v ON_ERROR_STOP=1 -v reader="$$READER" -v reader_password="$$READER_PASSWORD" -f /reader.sql']
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: "no"

  async-import:
    profiles: ["app"]
    image: bx-yunpan-async-import:${APP_IMAGE_TAG:-local}
    build:
      context: ../backend
      args: {TARGET: async-import, GO_VERSION: "${GO_VERSION:-1.25.13}"}
    environment:
      <<: *app-environment
      ASYNC_LEGACY_WRITERS_STOPPED: ${ASYNC_LEGACY_WRITERS_STOPPED:-false}
    depends_on:
      rabbitmq: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
      migrate-control: {condition: service_completed_successfully}
      async-reader-init: {condition: service_completed_successfully}
    restart: "no"

