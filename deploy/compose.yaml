    build:
      context: ../backend
      args:
        TARGET: async-control
        GO_VERSION: ${GO_VERSION:-1.25.13}
    environment:
      <<: *app-environment
      DASHSCOPE_API_KEY: ""
      AI_INTENT_MIGRATION_DSN: ""
      AI_CONTROL_MIGRATION_DSN: ""
      AI_SCOPE_SIGNING_SEED: ""
      AI_MIGRATION_DSN: ""
      AI_COMMIT_DSN: ""
      AI_COMPUTE_DSN: ""
