global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/high-concurrency.rules.yaml

scrape_configs:
  - job_name: bx-yunpan-api
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 8081
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: service
        replacement: core-api

  - job_name: bx-yunpan-workers
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["outbox-relay", "object-worker", "media-worker", "maintenance-worker", "upload-worker", "search-indexer"]
        type: A
        port: 8083
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: service

  - job_name: bx-yunpan-parser
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["parser-svc"]
        type: A
        port: 8083
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: service

  - job_name: bx-yunpan-rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["rabbitmq:15692"]
