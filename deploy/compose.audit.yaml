# Used only with compose.staging.yaml and staging.env.example.
services:
  api:
    ports: ["127.0.0.1::8081"]
    environment:
      LOG_LEVEL: warn
    mem_limit: 256m
  ai-query:
    environment:
      AI_RATE_LIMIT_ENABLED: "false"
      LOG_LEVEL: warn
    mem_limit: 256m
  ai-indexer:
    environment:
      LOG_LEVEL: warn
    mem_limit: 256m
  outbox-relay:
    environment:
      LOG_LEVEL: warn
      OBJECT_GC_DELAY: 2s
    mem_limit: 128m
  object-worker:
    environment:
      LOG_LEVEL: warn
    mem_limit: 256m
  media-worker:
    environment:
      LOG_LEVEL: warn
    mem_limit: 256m
  maintenance-worker:
    environment:
      LOG_LEVEL: warn
    mem_limit: 256m
  upload-worker:
    environment:
      LOG_LEVEL: warn
    mem_limit: 256m
  search-indexer:
    environment:
      LOG_LEVEL: warn
    mem_limit: 256m
