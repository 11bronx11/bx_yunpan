name: bx-yunpan-hc

# Dedicated rehearsal dependencies. No application .env or existing volumes.
services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_USER: hc
      POSTGRES_PASSWORD: hc-local-only
      POSTGRES_DB: hc
    ports:
      - "127.0.0.1:${HC_POSTGRES_PORT:-15432}:5432"
    volumes:
      - hc-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hc -d hc"]
      interval: 2s
      timeout: 2s
      retries: 30
    mem_limit: 256m
  redis:
    image: redis:8.10-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${HC_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    mem_limit: 96m
  minio:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: hc-local
      MINIO_ROOT_PASSWORD: hc-local-only
    ports:
      - "127.0.0.1:${HC_MINIO_PORT:-19000}:9000"
    volumes:
      - hc-minio:/data
    healthcheck:
      test: ["CMD-SHELL", 'mc alias set health http://127.0.0.1:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null 2>&1 && mc ready --quiet health']
      interval: 2s
      timeout: 2s
      retries: 30
    mem_limit: 256m

volumes:
  hc-postgres:
  hc-minio:
