syntax = "proto3";

package yunpan.ai.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/11bronx11/bx_yunpan/backend/internal/ai/pb;pb";

// AIService 承载文本抽取、Embedding 与 RAG 问答等 CPU/IO 密集工作。
// owner_id 由调用方显式传递；权限过滤仍在 AI 服务侧下推到 SQL 完成，
// Citation 回验也留在 AI 服务侧，避免授权边界被拆散。
service AIService {
  // Search 以 server streaming 返回命中，调用方可边收边渲染。
  rpc Search(SearchRequest) returns (stream SearchHit);
  // Ask 执行 RAG 问答。非幂等且有外部模型成本，客户端不重试。
  rpc Ask(AskRequest) returns (AskResponse);
  // Reprocess 触发重建索引，靠 Pipeline/Model Version 保证幂等，可重试。
  rpc Reprocess(ReprocessRequest) returns (ReprocessResponse);
}

// DocumentParserService isolates CPU and memory intensive document parsing
// from the AI indexer. Its instances are discovered independently from AIService.
service DocumentParserService {
  rpc ParseDocument(ParseDocumentRequest) returns (ParseDocumentResponse);
}

message ParseDocumentRequest {
  string run_id = 1;
  string object_id = 2;
  string document_version_id = 3;
  string content_hash = 4;
  string media_type = 5;
  bytes content = 6;
  string parser_profile_version = 7;
  int64 size_limit_bytes = 8;
  int32 page_limit = 9;
  int64 pixel_limit = 10;
  string trace_id = 11;
  int32 chunk_token_budget = 12;
  int32 chunk_overlap_tokens = 13;
  int32 max_chunks = 14;
  string chunker_version = 15;
  string tokenizer_id = 16;
}

message ParseDocumentResponse {
  string artifact_uri = 1;
  string artifact_hash = 2;
  string parser_id = 3;
  string parser_version = 4;
  string language = 5;
  int32 page_count = 6;
  int32 block_count = 7;
  repeated ParsedSection sections = 8;
  ParseQuality quality = 9;
  repeated string warnings = 10;
  repeated ParsedChunk chunks = 11;
  string chunker_version = 12;
  string tokenizer_id = 13;
  bool chunks_truncated = 14;
}

message ParsedSection {
  string text = 1;
  int32 page_number = 2;
  string section = 3;
  string kind = 4;
  string heading_path = 5;
  int32 slide_number = 6;
  string sheet_name = 7;
  int32 row_start = 8;
  int32 row_end = 9;
  int32 column_start = 10;
  int32 column_end = 11;
  int64 source_start = 12;
  int64 source_end = 13;
  bool has_header = 14;
  repeated string merged_ranges = 15;
  string encoding = 16;
  int32 page_end = 17;
  string source_kind = 18;
}

message ParsedChunk {
  string content = 1;
  string kind = 2;
  string heading_path = 3;
  int32 page_start = 4;
  int32 page_end = 5;
  int32 slide_number = 6;
  string sheet_name = 7;
  int32 row_start = 8;
  int32 row_end = 9;
  int32 column_start = 10;
  int32 column_end = 11;
  int64 source_start = 12;
  int64 source_end = 13;
  int32 estimated_token_count = 14;
  bool token_count_is_estimate = 15;
  repeated string merged_ranges = 16;
  string encoding = 17;
  string source_kind = 18;
}

message ParseQuality {
  int32 text_bytes = 1;
  double text_density = 2;
  double empty_page_ratio = 3;
  int32 replacement_runes = 4;
}

message SearchRequest {
  string owner_id = 1;
  string query = 2;
  // name | fulltext | semantic | hybrid
  string mode = 3;
  optional string folder_id = 4;
  bool include_subfolders = 5;
  repeated string mime_types = 6;
  int32 limit = 7;
}

message FileRef {
  string id = 1;
  string owner_id = 2;
  string folder_id = 3;
  string object_id = 4;
  string name = 5;
  int64 size_bytes = 6;
  string mime_type = 7;
  int64 version = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message Citation {
  string id = 1;
  string file_id = 2;
  string file_name = 3;
  optional int32 page_number = 4;
  optional string section = 5;
  string excerpt = 6;
}

message SearchHit {
  FileRef file = 1;
  double score = 2;
  string match_type = 3;
  repeated Citation citations = 4;
}

message AskRequest {
  string owner_id = 1;
  string question = 2;
  optional string folder_id = 3;
  repeated string file_ids = 4;
}

message AskResponse {
  string answer = 1;
  repeated Citation citations = 2;
}

message ReprocessRequest {
  string owner_id = 1;
  string file_id = 2;
  string idempotency_key = 3;
}

message ReprocessResponse {
  Task task = 1;
}

message Task {
  string id = 1;
  string task_type = 2;
  string resource_type = 3;
  string resource_id = 4;
  string status = 5;
  int32 progress = 6;
  int32 attempt = 7;
  optional string error_code = 8;
  optional string error_message = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}
